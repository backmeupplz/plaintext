[package]
name = "plaintext-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Plaintext password manager: command line and MCP server"

[[bin]]
name = "plaintext"
path = "src/main.rs"

[dependencies]
plaintext-client = { path = "../client" }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Security keys (see build.rs for why only these).
[target.'cfg(any(target_os = "macos", all(target_os = "linux", target_env = "gnu")))'.dependencies]
ctap-hid-fido2 = "3.6"
anyhow = "1"

[dev-dependencies]
plaintext-server = { path = "../server" }
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
