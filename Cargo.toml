[workspace]
members = ["core", "server", "client", "cli", "wasm", "ffi", "android/bindgen"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
# Tests push tens of MB through crypto, JSON and SQLite: unoptimized, that alone took minutes.
[profile.test]
opt-level = 1
[profile.test.package."*"]
opt-level = 3

[profile.release]
lto = true
strip = true
codegen-units = 1

# The smallest .wasm for the browser (wasm/build.sh).
[profile.wasm]
inherits = "release"
opt-level = "z"
panic = "abort"
strip = false # wasm-bindgen reads the target_features section
